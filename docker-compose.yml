services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "5432:5432"
    volumes:
      - echo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=echo;Username=echo;Password=echo
      Jwt__Secret: EchoDevSecretKey_ChangeMe_AtLeast32Chars!
      Geo__SkipIpCheck: "false"
      Media__PublicBaseUrl: http://localhost:8080/media
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  echo_pgdata:
